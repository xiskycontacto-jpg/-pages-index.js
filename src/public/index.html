<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora IA — Centro de mando</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#eef3ff;font:15px/1.5 Inter,system-ui,Arial}main{max-width:1080px;margin:auto;padding:28px 18px}.brand{font-size:28px;font-weight:850;letter-spacing:.04em}.muted{color:#9aa9c2}.status{display:inline-flex;margin:14px 0;padding:7px 12px;border:1px solid #34415b;border-radius:99px;color:#b9c8df}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:22px 0}.card,.panel{background:#111b2d;border:1px solid #293750;border-radius:14px;padding:16px}.card h3{margin:0 0 5px}.panel{margin:18px 0}label{display:block;margin:12px 0 6px;color:#bdc9dc}select,textarea,input{width:100%;padding:12px;border-radius:9px;border:1px solid #35435e;background:#091426;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}button{margin-top:12px;padding:12px 18px;border:0;border-radius:9px;background:#477ff0;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#091426;padding:16px;border-radius:10px;min-height:60px}img{max-width:100%;border-radius:12px;margin-top:14px}small{color:#98a8c2}
</style></head><body><main>
<div class="brand">NEXORA IA</div><div class="muted">Centro de mando · SUPREMA y equipo de agentes</div>
<div class="status" id="health">Comprobando servicios…</div>
<section class="grid" id="agents"></section>
<section class="panel"><h2>Ejecutar un agente</h2><label for="agent">Agente</label><select id="agent"><option value="suprema">SUPREMA — Dirección</option><option value="opportunity-hunter">Opportunity Hunter</option><option value="money-growth">Money & Growth</option><option value="sales-copilot">Sales Copilot</option><option value="social-media">Social Media Manager</option><option value="content-factory">Content Factory</option><option value="music-video">Music & Video Producer</option><option value="automation-engineer">Automation Engineer</option></select><label for="task">¿Qué necesitas que haga?</label><textarea id="task" placeholder="Describe el objetivo, el contexto y el resultado que necesitas…"></textarea><button id="run">Ejecutar tarea</button><pre id="answer">La respuesta del agente aparecerá aquí.</pre></section>
<section class="panel"><h2>Generador de imágenes</h2><label for="prompt">Descripción de la imagen</label><textarea id="prompt" placeholder="Describe la imagen que quieres crear…"></textarea><button id="imageBtn">Generar imagen</button><div id="imageResult"></div></section>
<small>Nexora IA · Las acciones externas y publicaciones requieren autorización expresa.</small>
</main><script>
const $=id=>document.getElementById(id);
async function load(){try{const [h,a]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/agents').then(r=>r.json())]);$('health').textContent='Servicios: '+h.status+' · IA: '+(h.llm_connected?'conectada':'sin configurar')+' · Memoria: '+(h.memory_connected?'conectada':'sin configurar')+' · Imágenes: '+(h.image_generation_configured?'configuradas':'sin configurar');$('agents').innerHTML=a.agents.map(x=>'<article class="card"><h3>'+x.name+'</h3><small>'+x.area+'</small><p class="muted">'+x.mission+'</p></article>').join('')}catch(e){$('health').textContent='No se pudo consultar el estado: '+e.message}}
$('run').onclick=async()=>{const b=$('run');b.disabled=true;$('answer').textContent='SUPREMA está trabajando…';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:$('agent').value,task:$('task').value})});const d=await r.json();const meta=d.ok?'\n\n— Diagnóstico —\nAgente: '+d.agent+' · Modelo: '+d.provider+' / '+d.model+'\nMemoria leída: '+(d.memory_read?'sí':'no')+' · Memoria guardada: '+(d.memory_saved?'sí':'no'):'';$('answer').textContent=(d.answer||d.error||'Sin respuesta')+meta}catch(e){$('answer').textContent=e.message}finally{b.disabled=false}};
$('imageBtn').onclick=async()=>{const b=$('imageBtn');b.disabled=true;$('imageResult').textContent='Generando…';try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value})});const d=await r.json();$('imageResult').innerHTML=d.image?'<img alt="Imagen generada" src="'+d.image+'">':'<pre>'+ (d.error||'Error')+'</pre>'}catch(e){$('imageResult').textContent=e.message}finally{b.disabled=false}};
load();
</script></body></html>
